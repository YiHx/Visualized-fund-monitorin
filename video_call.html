<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时音视频通话</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0e27; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .video-container { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .remote-video { position: absolute; width: 100%; height: 100%; }
        .local-video { position: absolute; bottom: 12px; right: 12px; width: 25%; aspect-ratio: 16/9; border: 3px solid #34d399; border-radius: 8px; background: #000; z-index: 10; }
        .control-bar { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; }
        .btn-control { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer; font-size: 24px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-mic { background: #10b981; color: white; }
        .btn-mic.off { background: #ef4444; }
        .btn-camera { background: #3b82f6; color: white; }
        .btn-camera.off { background: #ef4444; }
        .btn-hangup { background: #ef4444; color: white; width: 70px; border-radius: 8px; padding: 8px 16px; }
        .btn-control:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .status-bar { text-align: center; padding: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 8px; margin-bottom: 20px; }
        .status-bar.error { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #ef4444; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #34d399; border-top: 3px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .user-label { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; font-size: 12px; z-index: 5; }
    </style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">
    <!-- 标题 -->
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-emerald-400 mb-2">🎥 实时音视频通话</h1>
        <p class="text-gray-400" id="connectionStatus">连接中...</p>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
        <span class="loading"></span> 正在初始化摄像头和麦克风...
    </div>

    <!-- 视频容器 -->
    <div class="video-container">
        <!-- 远程视频 -->
        <video id="remoteVideo" class="remote-video" playsinline autoplay></video>
        <div class="user-label">对方</div>

        <!-- 本地视频 -->
        <video id="localVideo" class="local-video" playsinline autoplay muted></video>
    </div>

    <!-- 控制栏 -->
    <div class="control-bar">
        <button class="btn-control btn-mic" id="micBtn" title="切换麦克风">🎤</button>
        <button class="btn-control btn-camera" id="cameraBtn" title="切换摄像头">📹</button>
        <button class="btn-control btn-hangup" id="hangupBtn" title="挂断通话">
            <span>✕</span> 挂断
        </button>
    </div>

    <!-- 统计信息 -->
    <div class="mt-8 grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
        <div class="bg-gray-900 p-4 rounded border border-gray-700">
            <div class="text-gray-400">延迟</div>
            <div class="text-lg font-mono text-emerald-400" id="latency">-- ms</div>
        </div>
        <div class="bg-gray-900 p-4 rounded border border-gray-700">
            <div class="text-gray-400">分辨率</div>
            <div class="text-lg font-mono text-emerald-400" id="resolution">-- x --</div>
        </div>
        <div class="bg-gray-900 p-4 rounded border border-gray-700">
            <div class="text-gray-400">帧率</div>
            <div class="text-lg font-mono text-emerald-400" id="frameRate">-- fps</div>
        </div>
        <div class="bg-gray-900 p-4 rounded border border-gray-700">
            <div class="text-gray-400">连接状态</div>
            <div class="text-lg font-mono text-emerald-400" id="connState">连接中...</div>
        </div>
    </div>
</div>

<script>
    // 获取 URL 参数和常量
    const params = new URLSearchParams(window.location.search);
    const callId = params.get('call_id') || `call_${Date.now()}`;
    const userType = params.get('user_type') || 'lp'; // lp 或 gp
    const API_BASE = '/api/v1';

    // 获取 DOM 元素
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const micBtn = document.getElementById('micBtn');
    const cameraBtn = document.getElementById('cameraBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const statusBar = document.getElementById('statusBar');
    const connectionStatus = document.getElementById('connectionStatus');

    // 状态变量
    let peerConnection = null;
    let localStream = null;
    let websocket = null;
    let micEnabled = true;
    let cameraEnabled = true;
    let statsInterval = null;
    let hasSentOffer = false;
    let offerRetryTimer = null;

    // STUN & TURN 服务器配置（支持复杂网络下的穿透）
    const iceServers = [
        // STUN 服务器列表
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        // TURN 中继服务器列表（用于解决复杂网络下的卡顿/断流）
        { 
            urls: ['turn:numb.viagenie.ca:3478'],
            username: 'webrtc@live.com',
            credential: 'webrtc'
        },
        { 
            urls: ['turn:turn.bistri.com:80'],
            username: 'webrtc',
            credential: 'webrtc'
        },
        { 
            urls: ['turn:turn.anyfirewall.com:443?transport=tcp'],
            username: 'webrtc',
            credential: 'webrtc'
        }
    ];

    // 稳定优先的媒体配置（360p）
    const VIDEO_CONSTRAINTS = {
        width: { ideal: 640, max: 640 },
        height: { ideal: 360, max: 360 },
        frameRate: { ideal: 15, max: 20 },
        facingMode: 'user'
    };

    // 初始化
    async function init() {
        try {
            // 如果是 GP（被呼方），先接受通话请求
            if (userType === 'gp') {
                updateStatus('正在接受通话请求...', false);
                const acceptRes = await fetch(`${API_BASE}/gp/accept_call/${callId}`, { method: 'POST' });
                const acceptData = await acceptRes.json();
                if (acceptData.status !== 'success') {
                    throw new Error('通话请求已过期或不存在，对方可能已挂断');
                }
                updateStatus('已接受通话，正在初始化...', false);
                console.log('✅ 已接受通话请求');
            }

            // 1. 初始化本地媒体流
            await initLocalStream();
            
            // 2. 创建 WebSocket 连接
            await connectWebSocket();
            
            // 3. 创建 WebRTC 连接
            initPeerConnection();

            // 4. 发送就绪信号，LP 等待 GP ready 后再发 offer，避免时序丢信令
            websocket.send(JSON.stringify({ type: 'ready', data: { user_type: userType } }));
            if (userType === 'lp') {
                updateStatus('等待对方接听...', false);
            }

            updateStatus('通话已连接，等待对方回应...', false);
            startStatsMonitoring();
        } catch (error) {
            console.error('初始化失败:', error);
            updateStatus(`初始化失败: ${error.message}`, true);
        }
    }

    // 初始化本地媒体流
    async function initLocalStream() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true },
                video: VIDEO_CONSTRAINTS
            });
            localVideo.srcObject = localStream;
            updateStatus('摄像头和麦克风已就绪', false);
        } catch (error) {
            throw new Error(`无法获取媒体设备: ${error.message}`);
        }
    }

    // 连接 WebSocket
    function connectWebSocket() {
        return new Promise((resolve, reject) => {
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const url = `${protocol}://${window.location.host}/ws/video_call/${callId}/${userType}`;
            
            websocket = new WebSocket(url);

            websocket.onopen = () => {
                console.log('✅ WebSocket 已连接');
                updateStatus('信号通道已建立', false);
                resolve();
            };

            websocket.onmessage = async (event) => {
                const message = JSON.parse(event.data);
                await handleSignalingMessage(message);
            };

            websocket.onerror = (error) => {
                console.error('❌ WebSocket 错误:', error);
                updateStatus('信号连接失败', true);
                reject(error);
            };

            websocket.onclose = () => {
                console.log('WebSocket 已断开');
                updateStatus('连接已断开', true);
            };
        });
    }

    // 初始化 WebRTC 连接
    function initPeerConnection() {
        peerConnection = new RTCPeerConnection({ iceServers });

        // 添加本地媒体轨道
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        // 对发送参数做保守限流，优先流畅和稳定
        tuneSenderParameters();

        // 处理远程媒体流
        peerConnection.ontrack = (event) => {
            console.log('✅ 收到远程媒体流');
            remoteVideo.srcObject = event.streams[0];
            remoteVideo.play?.().catch(() => {});
            updateStatus('对方已接入，通话进行中...', false);
        };

        // 处理 ICE 候选者
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                websocket.send(JSON.stringify({ type: 'ice-candidate', data: event.candidate }));
            }
        };

        // 监听连接状态
        peerConnection.onconnectionstatechange = () => {
            console.log('连接状态:', peerConnection.connectionState);
            document.getElementById('connState').textContent = peerConnection.connectionState;
            
            if (peerConnection.connectionState === 'failed') {
                updateStatus('连接失败，请检查网络', true);
            }

            if (peerConnection.connectionState === 'connected') {
                clearTimeout(offerRetryTimer);
            }
        };

        peerConnection.oniceconnectionstatechange = () => {
            console.log('ICE 连接状态:', peerConnection.iceConnectionState);
        };
    }

    function tuneSenderParameters() {
        const senders = peerConnection.getSenders ? peerConnection.getSenders() : [];
        senders.forEach((sender) => {
            if (!sender.track || !sender.getParameters || !sender.setParameters) return;
            const params = sender.getParameters() || {};
            if (!params.encodings || params.encodings.length === 0) {
                params.encodings = [{}];
            }

            if (sender.track.kind === 'video') {
                // 360p 场景初始码率 500kbps，支持动态自适应
                params.encodings[0].maxBitrate = 500 * 1000; // 500 kbps 初始值
                params.encodings[0].maxFramerate = 15;
                params.degradationPreference = 'maintain-framerate';
            } else if (sender.track.kind === 'audio') {
                params.encodings[0].maxBitrate = 64 * 1000; // 64 kbps
            }

            sender.setParameters(params).catch((e) => {
                console.warn('发送参数调优失败:', e);
            });
        });
    }

    // 动态自适应码率：根据丢包率自动调整视频码率
    let videoBitrate = 500 * 1000; // 当前码率（初始 500kbps）
    let lastPacketsLost = 0;
    let lastReportTime = Date.now();

    async function adaptiveBitrateControl() {
        if (!peerConnection) return;
        
        try {
            const stats = await peerConnection.getStats();
            let packetsLost = 0;
            let packetsSent = 0;
            let currentReportTime = Date.now();

            stats.forEach(report => {
                // 监控发送端的丢包情况
                if (report.type === 'outbound-rtp' && report.mediaType === 'video') {
                    packetsLost = report.packetsLost || 0;
                    packetsSent = report.packetsSent || 0;
                }
            });

            // 计算丢包率
            const lostDelta = packetsLost - lastPacketsLost;
            const timeDelta = (currentReportTime - lastReportTime) / 1000; // 秒
            const packetLossRate = packetsSent > 0 ? (lostDelta / packetsSent) : 0;

            console.log(`📊 丢包率: ${(packetLossRate * 100).toFixed(2)}%, 当前码率: ${(videoBitrate / 1000).toFixed(0)}kbps`);

            // 根据丢包率动态调整码率
            const senders = peerConnection.getSenders ? peerConnection.getSenders() : [];
            senders.forEach((sender) => {
                if (!sender.track || sender.track.kind !== 'video') return;
                
                const params = sender.getParameters();
                if (!params.encodings || params.encodings.length === 0) return;

                if (packetLossRate > 0.08) {
                    // 丢包率 > 8%：降低到 300kbps
                    if (videoBitrate !== 300 * 1000) {
                        videoBitrate = 300 * 1000;
                        console.log('🔴 网络恶劣（丢包率高），降速至 300kbps');
                    }
                } else if (packetLossRate > 0.05) {
                    // 丢包率 5-8%：降低到 400kbps
                    if (videoBitrate !== 400 * 1000) {
                        videoBitrate = 400 * 1000;
                        console.log('🟡 网络一般（丢包率中），降速至 400kbps');
                    }
                } else if (packetLossRate < 0.02) {
                    // 丢包率 < 2%：尝试恢复到 500kbps
                    if (videoBitrate !== 500 * 1000) {
                        videoBitrate = 500 * 1000;
                        console.log('🟢 网络良好，恢复至 500kbps');
                    }
                }

                params.encodings[0].maxBitrate = videoBitrate;
                sender.setParameters(params).catch((e) => {
                    console.warn('动态码率调整失败:', e);
                });
            });

            lastPacketsLost = packetsLost;
            lastReportTime = currentReportTime;
        } catch (error) {
            console.warn('自适应码率控制出错:', error);
        }
    }

    // 处理信号消息
    async function handleSignalingMessage(message) {
        try {
            if (message.type === 'ready') {
                // 只有 LP 负责发 offer，且仅发送一次
                if (userType === 'lp' && !hasSentOffer) {
                    await sendOffer();
                }
                return;
            }

            if (message.type === 'offer') {
                if (!peerConnection.currentLocalDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    websocket.send(JSON.stringify({ type: 'answer', data: answer }));
                }
            } else if (message.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(message.data));
            } else if (message.type === 'ice-candidate') {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(message.data));
                } catch (error) {
                    console.warn('添加 ICE 候选者失败:', error);
                }
            }
        } catch (error) {
            console.error('处理信号消息失败:', error);
        }
    }

    async function sendOffer() {
        if (!peerConnection || hasSentOffer) return;
        hasSentOffer = true;

        const offer = await peerConnection.createOffer({
            offerToReceiveAudio: true,
            offerToReceiveVideo: true
        });
        await peerConnection.setLocalDescription(offer);
        websocket.send(JSON.stringify({ type: 'offer', data: offer }));

        // 若 8 秒后仍未连通，自动再发一次 offer 兜底
        offerRetryTimer = setTimeout(async () => {
            if (!peerConnection) return;
            if (peerConnection.connectionState === 'connected') return;
            try {
                const retryOffer = await peerConnection.createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });
                await peerConnection.setLocalDescription(retryOffer);
                websocket.send(JSON.stringify({ type: 'offer', data: retryOffer }));
            } catch (e) {
                console.warn('offer 重试失败:', e);
            }
        }, 8000);
    }

    // 麦克风控制
    micBtn.onclick = () => {
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach(track => {
            track.enabled = micEnabled;
        });
        micBtn.classList.toggle('off', !micEnabled);
        micBtn.textContent = micEnabled ? '🎤' : '🔇';
    };

    // 摄像头控制
    cameraBtn.onclick = () => {
        cameraEnabled = !cameraEnabled;
        localStream.getVideoTracks().forEach(track => {
            track.enabled = cameraEnabled;
        });
        cameraBtn.classList.toggle('off', !cameraEnabled);
        cameraBtn.textContent = cameraEnabled ? '📹' : '📹❌';
    };

    // 挂断通话
    hangupBtn.onclick = () => {
        if (confirm('确定要结束通话吗？')) {
            endCall();
        }
    };

    // 结束通话
    function endCall() {
        // 停止所有媒体轨道
        localStream?.getTracks().forEach(track => track.stop());
        
        // 关闭 WebRTC 连接
        peerConnection?.close();
        
        // 关闭 WebSocket
        websocket?.close();
        
        // 停止统计
        clearInterval(statsInterval);
        clearTimeout(offerRetryTimer);
        
        // 返回到原来的页面
        setTimeout(() => {
            window.location.href = userType === 'gp' ? '/admin' : '/';
        }, 500);
    }

    // 监控连接统计
    function startStatsMonitoring() {
        statsInterval = setInterval(async () => {
            if (!peerConnection) return;
            
            try {
                const stats = await peerConnection.getStats();
                let latency = '--';
                let resolution = '-- x --';
                let frameRate = '--';

                stats.forEach(report => {
                    if (report.type === 'inbound-rtp' && report.mediaType === 'video') {
                        latency = Math.round(report.roundTripTime * 1000) + ' ms';
                        resolution = `${report.frameWidth} x ${report.frameHeight}`;
                        frameRate = Math.round(report.framesPerSecond) + ' fps';
                    }
                });

                document.getElementById('latency').textContent = latency;
                document.getElementById('resolution').textContent = resolution;
                document.getElementById('frameRate').textContent = frameRate;

                // 启用动态自适应码率控制（每秒检查丢包率并调整）
                await adaptiveBitrateControl();
            } catch (error) {
                console.warn('获取统计失败:', error);
            }
        }, 1000);
    }

    // 更新状态信息
    function updateStatus(message, isError = false) {
        statusBar.textContent = message;
        statusBar.classList.toggle('error', isError);
        connectionStatus.textContent = message;
    }

    // 页面卸载时清理
    window.onbeforeunload = () => {
        endCall();
    };

    // 启动初始化
    init();
</script>
</body>
</html>
