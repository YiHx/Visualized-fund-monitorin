<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时音视频通话</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0e27; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .video-container { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .remote-video { position: absolute; width: 100%; height: 100%; }
        .local-video { position: absolute; bottom: 12px; right: 12px; width: 25%; aspect-ratio: 16/9; border: 3px solid #34d399; border-radius: 8px; background: #000; z-index: 10; }
        .control-bar { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; }
        .btn-control { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer; font-size: 24px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-mic { background: #10b981; color: white; } .btn-mic.off { background: #ef4444; }
        .btn-camera { background: #3b82f6; color: white; } .btn-camera.off { background: #ef4444; }
        .btn-hangup { background: #ef4444; color: white; width: 70px; border-radius: 8px; padding: 8px 16px; }
        .btn-control:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .status-bar { text-align: center; padding: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 8px; margin-bottom: 20px; }
        .status-bar.error { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #ef4444; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #34d399; border-top: 3px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .user-label { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; font-size: 12px; z-index: 5; }
    </style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-emerald-400 mb-2">🎥 实时音视频通话</h1>
        <p class="text-gray-400" id="connectionStatus">连接中...</p>
    </div>

    <div class="status-bar" id="statusBar">
        <span class="loading"></span> 正在初始化摄像头和麦克风...
    </div>

    <div class="video-container">
        <video id="remoteVideo" class="remote-video" playsinline autoplay></video>
        <div class="user-label">对方</div>
        <video id="localVideo" class="local-video" playsinline autoplay muted></video>
    </div>

    <div class="control-bar">
        <button class="btn-control btn-mic" id="micBtn" title="切换麦克风">🎤</button>
        <button class="btn-control btn-camera" id="cameraBtn" title="切换摄像头">📹</button>
        <button class="btn-control btn-hangup" id="hangupBtn" title="挂断通话"><span>✕</span> 挂断</button>
    </div>

    <div class="mt-8 grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
        <div class="bg-gray-900 p-4 rounded border border-gray-700"><div class="text-gray-400">延迟</div><div class="text-lg font-mono text-emerald-400" id="latency">-- ms</div></div>
        <div class="bg-gray-900 p-4 rounded border border-gray-700"><div class="text-gray-400">分辨率</div><div class="text-lg font-mono text-emerald-400" id="resolution">-- x --</div></div>
        <div class="bg-gray-900 p-4 rounded border border-gray-700"><div class="text-gray-400">帧率</div><div class="text-lg font-mono text-emerald-400" id="frameRate">-- fps</div></div>
        <div class="bg-gray-900 p-4 rounded border border-gray-700"><div class="text-gray-400">连接状态</div><div class="text-lg font-mono text-emerald-400" id="connState">连接中...</div></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const callId = params.get('call_id') || `call_${Date.now()}`;
    const userType = params.get('user_type') || 'lp';
    const API_BASE = '/api/v1';

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const micBtn = document.getElementById('micBtn');
    const cameraBtn = document.getElementById('cameraBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const statusBar = document.getElementById('statusBar');
    const connectionStatus = document.getElementById('connectionStatus');

    let peerConnection = null;
    let localStream = null;
    let websocket = null;
    let micEnabled = true;
    let cameraEnabled = true;
    let statsInterval = null;
    // ✅ 修复：ICE candidate 缓冲 + remote desc 标记
    let pendingCandidates = [];
    let remoteDescSet = false;

    const iceServers = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: ['turn:numb.viagenie.ca:3478'], username: 'webrtc@live.com', credential: 'webrtc' },
        { urls: ['turn:turn.anyfirewall.com:443?transport=tcp'], username: 'webrtc', credential: 'webrtc' }
    ];

    const VIDEO_CONSTRAINTS = { width: { ideal: 640, max: 640 }, height: { ideal: 360, max: 360 }, frameRate: { ideal: 15, max: 20 }, facingMode: 'user' };

    async function init() {
        try {
            if (userType === 'gp') {
                updateStatus('正在接受通话请求...', false);
                const acceptRes = await fetch(`${API_BASE}/gp/accept_call/${callId}`, { method: 'POST' });
                const acceptData = await acceptRes.json();
                if (acceptData.status !== 'success') throw new Error('通话请求已过期或不存在，对方可能已挂断');
                updateStatus('已接受通话，正在初始化...', false);
            }

            await initLocalStream();
            await connectWebSocket();
            initPeerConnection();

            // ✅ 修复：GP 发送 joined（而非 ready），LP 收到后发 offer
            if (userType === 'gp') {
                websocket.send(JSON.stringify({ type: 'joined' }));
            } else {
                websocket.send(JSON.stringify({ type: 'ready' }));
                updateStatus('等待对方接听...', false);
            }

            updateStatus('通话已连接，等待对方回应...', false);
            startStatsMonitoring();
        } catch (error) {
            console.error('初始化失败:', error);
            updateStatus(`初始化失败: ${error.message}`, true);
        }
    }

    async function initLocalStream() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true },
                video: VIDEO_CONSTRAINTS
            });
            localVideo.srcObject = localStream;
            updateStatus('摄像头和麦克风已就绪', false);
        } catch (error) {
            throw new Error(`无法获取媒体设备: ${error.message}`);
        }
    }

    function connectWebSocket() {
        return new Promise((resolve, reject) => {
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const url = `${protocol}://${window.location.host}/ws/video_call/${callId}/${userType}`;
            websocket = new WebSocket(url);
            websocket.onopen = () => { console.log('✅ WebSocket 已连接'); updateStatus('信号通道已建立', false); resolve(); };
            websocket.onmessage = async (event) => { const message = JSON.parse(event.data); await handleSignalingMessage(message); };
            websocket.onerror = (error) => { console.error('❌ WebSocket 错误:', error); updateStatus('信号连接失败', true); reject(error); };
            websocket.onclose = () => { console.log('WebSocket 已断开'); updateStatus('连接已断开', true); };
        });
    }

    function initPeerConnection() {
        peerConnection = new RTCPeerConnection({ iceServers });
        localStream.getTracks().forEach(track => { peerConnection.addTrack(track, localStream); });
        tuneSenderParameters();

        peerConnection.ontrack = (event) => {
            console.log('✅ 收到远程媒体流');
            remoteVideo.srcObject = event.streams[0];
            remoteVideo.play?.().catch(() => {});
            updateStatus('对方已接入，通话进行中...', false);
        };

        peerConnection.onicecandidate = (event) => {
            if (event.candidate && websocket?.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({ type: 'ice-candidate', data: event.candidate }));
            }
        };

        peerConnection.onconnectionstatechange = () => {
            document.getElementById('connState').textContent = peerConnection.connectionState;
            if (peerConnection.connectionState === 'failed') updateStatus('连接失败，请检查网络', true);
            if (peerConnection.connectionState === 'connected') updateStatus('通话中...', false);
        };

        peerConnection.oniceconnectionstatechange = () => {
            console.log('ICE 连接状态:', peerConnection.iceConnectionState);
        };
    }

    function tuneSenderParameters() {
        const senders = peerConnection.getSenders ? peerConnection.getSenders() : [];
        senders.forEach((sender) => {
            if (!sender.track || !sender.getParameters || !sender.setParameters) return;
            const params = sender.getParameters() || {};
            if (!params.encodings || params.encodings.length === 0) params.encodings = [{}];
            if (sender.track.kind === 'video') {
                params.encodings[0].maxBitrate = 500 * 1000;
                params.encodings[0].maxFramerate = 15;
                params.degradationPreference = 'maintain-framerate';
            } else if (sender.track.kind === 'audio') {
                params.encodings[0].maxBitrate = 64 * 1000;
            }
            sender.setParameters(params).catch((e) => { console.warn('发送参数调优失败:', e); });
        });
    }

    // ✅ 修复：ICE candidate 时序处理 + joined 信号
    async function handleSignalingMessage(message) {
        try {
            // 对端挂断
            if (message.type === 'peer-disconnected') {
                updateStatus('对方已挂断', true);
                setTimeout(endCall, 2000);
                return;
            }

            // LP 收到 GP 的 joined 信号 → 发 offer
            if (message.type === 'joined' && userType === 'lp') {
                await sendOffer();
                return;
            }

            if (message.type === 'offer') {
                if (!peerConnection.currentLocalDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.data));
                    remoteDescSet = true;
                    // ✅ 立即处理之前缓存的 ICE candidates
                    for (const c of pendingCandidates) {
                        try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); } catch(e) {}
                    }
                    pendingCandidates = [];
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    websocket.send(JSON.stringify({ type: 'answer', data: answer }));
                }
                return;
            }

            if (message.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(message.data));
                remoteDescSet = true;
                // ✅ 处理缓存的 ICE candidates
                for (const c of pendingCandidates) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); } catch(e) {}
                }
                pendingCandidates = [];
                return;
            }

            if (message.type === 'ice-candidate') {
                // ✅ 修复：先检查 remote description 是否已设置
                if (remoteDescSet) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(message.data));
                    } catch(e) { console.warn('ICE candidate 添加失败:', e); }
                } else {
                    // 缓存，等 setRemoteDescription 后再处理
                    pendingCandidates.push(message.data);
                }
                return;
            }
        } catch (error) {
            console.error('处理信号消息失败:', error);
        }
    }

    async function sendOffer() {
        if (!peerConnection) return;
        const offer = await peerConnection.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
        await peerConnection.setLocalDescription(offer);
        websocket.send(JSON.stringify({ type: 'offer', data: offer }));
    }

    micBtn.onclick = () => {
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach(track => { track.enabled = micEnabled; });
        micBtn.classList.toggle('off', !micEnabled);
        micBtn.textContent = micEnabled ? '🎤' : '🔇';
    };

    cameraBtn.onclick = () => {
        cameraEnabled = !cameraEnabled;
        localStream.getVideoTracks().forEach(track => { track.enabled = cameraEnabled; });
        cameraBtn.classList.toggle('off', !cameraEnabled);
        cameraBtn.textContent = cameraEnabled ? '📹' : '📹❌';
    };

    hangupBtn.onclick = () => { endCall(); };

    function endCall() {
        localStream?.getTracks().forEach(track => track.stop());
        peerConnection?.close();
        websocket?.close();
        clearInterval(statsInterval);
        setTimeout(() => { window.location.href = userType === 'gp' ? '/admin' : '/'; }, 500);
    }

    function startStatsMonitoring() {
        statsInterval = setInterval(async () => {
            if (!peerConnection) return;
            try {
                const stats = await peerConnection.getStats();
                let latency = '--', resolution = '-- x --', frameRate = '--';
                stats.forEach(report => {
                    if (report.type === 'inbound-rtp' && report.mediaType === 'video') {
                        latency = Math.round(report.roundTripTime * 1000) + ' ms';
                        resolution = `${report.frameWidth} x ${report.frameHeight}`;
                        frameRate = Math.round(report.framesPerSecond) + ' fps';
                    }
                });
                document.getElementById('latency').textContent = latency;
                document.getElementById('resolution').textContent = resolution;
                document.getElementById('frameRate').textContent = frameRate;
            } catch (error) { console.warn('获取统计失败:', error); }
        }, 1000);
    }

    function updateStatus(message, isError = false) {
        statusBar.textContent = message;
        statusBar.classList.toggle('error', isError);
        connectionStatus.textContent = message;
    }

    window.onbeforeunload = () => { endCall(); };

    init();
</script>
</body>
</html>
